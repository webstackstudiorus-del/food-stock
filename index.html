<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Склад продуктов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:16px}
    h2{margin:0 0 8px 0}
    .meta{opacity:.75;font-size:13px}
    .card{border:1px solid #eee;border-radius:16px;padding:14px;margin:12px 0}
    input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}
    button{border:0;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid #ddd;margin-left:8px}
    .actions{display:flex;gap:10px;margin-top:10px}
    .actions button{width:auto;flex:1}
    .muted{opacity:.7}
    .card b{font-size:16px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .chip{padding:6px 10px;border:1px solid #ddd;border-radius:999px;font-size:13px;opacity:.85}
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h2>Онлайн-склад</h2>
      <div class="meta">Добавляй продукты и смотри, что скоро истекает.</div>
    </div>
    <div id="modeChip" class="chip">Показать всё</div>
  </div>

  <div class="card">
    <input id="product" placeholder="Продукт (например: молоко)" />
    <div class="row">
      <input id="qty" placeholder="Количество (1 л, 2 шт)" />
      <input id="afterOpen" placeholder="Годен после вскрытия (дней)" inputmode="numeric" />
    </div>
    <div class="row">
      <div>
        <div class="meta">Срок годности (с упаковки)</div>
        <input id="exp" type="date" />
      </div>
      <div>
        <div class="meta">Дата вскрытия</div>
        <input id="open" type="date" />
      </div>
    </div>
    <button id="addBtn">Добавить</button>
    <div class="meta muted">Если указал дату вскрытия + дни — “Использовать до” считается от вскрытия.</div>
  </div>

  <div class="actions">
    <button id="reloadBtn">Обновить</button>
    <button id="soonBtn">Скоро/Просрочено</button>
  </div>

  <div id="list"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // === ТВОЙ Apps Script API ===
  const API_URL = "https://script.google.com/macros/s/AKfycbzNsQL2tIakYQlInJ1VWZhmh2a5bSAChOP8oLysFxFsI8BKgHBc8d4ejH0fI4BrMpCr/exec";

  let filterSoon = false;

  async function apiPost(payload){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    return await res.json();
  }

  async function apiGet(params){
    const url = new URL(API_URL);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
    const res = await fetch(url.toString());
    return await res.json();
  }

  function statusRu(status){
    if (status === "ok") return "Ок";
    if (status === "soon") return "Скоро закончится";
    if (status === "expired") return "Просрочено";
    return "";
  }

  function statusBadge(status){
    const s = statusRu(status);
    if (!s) return "";
    return `<span class="badge">${s}</span>`;
  }

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function itemHtml(i){
    const useBy = i.use_by || i.exp_date || "";
    const qty = i.qty ? `Кол-во: ${esc(i.qty)}` : "Кол-во: —";
    const opened = i.open_date ? `Вскрыто: ${esc(i.open_date)}` : "";
    const after = i.after_open_days ? `После вскрытия: ${esc(i.after_open_days)} дн.` : "";
    const line2 = [opened, after].filter(Boolean).join(" • ");

    return `
      <div class="card">
        <div><b>${esc(i.product || "")}</b>${statusBadge(i.status)}</div>
        <div class="meta">${qty}</div>
        <div class="meta">Использовать до: <b>${esc(useBy)}</b></div>
        ${line2 ? `<div class="meta muted">${esc(line2)}</div>` : ``}
        <div class="actions">
          <button onclick="delItem('${i.id}')">Удалить</button>
        </div>
      </div>
    `;
  }

  async function load(){
    const data = await apiGet({ action: "list" });
    const items = Array.isArray(data) ? data : [];

    const view = filterSoon
      ? items.filter(i => i.status === "soon" || i.status === "expired")
      : items;

    document.getElementById("modeChip").textContent = filterSoon ? "Только срочное" : "Показать всё";

    document.getElementById("list").innerHTML =
      view.length
        ? view.map(itemHtml).join("")
        : `<div class="meta" style="margin-top:14px">Пока пусто.</div>`;
  }

  async function add(){
    const product = document.getElementById("product").value.trim();
    const qty = document.getElementById("qty").value.trim();
    const exp_date = document.getElementById("exp").value;
    const open_date = document.getElementById("open").value;
    const after_open_days = document.getElementById("afterOpen").value.trim();

    if (!product) return tg.showAlert("Введите продукт");
    if (!exp_date && !open_date) return tg.showAlert("Укажите срок годности или дату вскрытия");

    // Telegram user id (кто добавил)
    const created_by = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "";

    const res = await apiPost({
      action: "add",
      item: { product, qty, exp_date, open_date, after_open_days, created_by }
    });

    if (!res.ok) return tg.showAlert("Ошибка добавления");

    document.getElementById("product").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("exp").value = "";
    document.getElementById("open").value = "";
    document.getElementById("afterOpen").value = "";

    await load();
  }

  window.delItem = async function(id){
    await apiPost({ action: "delete", id });
    await load();
  }

  document.getElementById("addBtn").onclick = add;
  document.getElementById("reloadBtn").onclick = load;
  document.getElementById("soonBtn").onclick = () => { filterSoon = !filterSoon; load(); };

  load();
</script>
</body>
</html>
