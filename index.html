<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>едахуйня — склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#0b0d10;
      --card:#12151b;
      --text:#e8eef8;
      --muted:rgba(232,238,248,.65);
      --stroke:rgba(232,238,248,.12);
      --chip:rgba(232,238,248,.08);
      --ok:#2ecc71;
      --soon:#f1c40f;
      --expired:#ff4d4f;
      --btn:#1e2530;
      --btn2:#223042;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
    }

    /* если откроют в светлой среде — всё равно держим тёмную,
       потом на следующем этапе сделаем переключатель как в Лавке */
    html,body{background:var(--bg); color:var(--text);}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:16px;}

    h2{margin:0 0 6px 0; font-size:20px; letter-spacing:.2px;}
    .meta{color:var(--muted); font-size:13px; line-height:1.35;}

    .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px;}
    .chip{padding:8px 12px; background:var(--chip); border:1px solid var(--stroke); border-radius:999px; font-size:13px; color:var(--muted);}

    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      padding:14px;
      margin:12px 0;
      box-shadow: var(--shadow);
    }

    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

    input, select, button{
      width:100%;
      padding:12px;
      margin:6px 0;
      border:1px solid var(--stroke);
      border-radius:14px;
      font-size:16px;
      background:#0e1218;
      color:var(--text);
      outline:none;
    }
    input::placeholder{color:rgba(232,238,248,.35);}
    button{
      border:0;
      background:var(--btn);
      cursor:pointer;
      transition:.15s ease;
    }
    button:hover{transform:translateY(-1px); background:var(--btn2);}
    button.primary{background:#2a3b55;}
    button.primary:hover{background:#314a6e;}
    button.danger{background:#3a1f22;}
    button.danger:hover{background:#4a262a;}

    .actionsRow{display:flex; gap:10px; margin-top:10px;}
    .actionsRow button{margin:0;}

    .rowTitle{display:flex; align-items:center; gap:10px;}
    .name{font-weight:700; font-size:16px;}
    .pill{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--stroke);
      color:var(--muted);
      background:rgba(232,238,248,.05);
    }
    .pill.ok{border-color:rgba(46,204,113,.35); color:rgba(46,204,113,.9); background:rgba(46,204,113,.08);}
    .pill.soon{border-color:rgba(241,196,15,.35); color:rgba(241,196,15,.95); background:rgba(241,196,15,.08);}
    .pill.expired{border-color:rgba(255,77,79,.35); color:rgba(255,77,79,.95); background:rgba(255,77,79,.10);}

    .subline{color:var(--muted); font-size:13px; margin-top:6px;}
    .subline b{color:var(--text);}

    .sep{height:1px; background:var(--stroke); margin:10px 0;}
    .empty{color:var(--muted); margin-top:14px;}

    /* компактнее на очень узких */
    @media (max-width: 380px){
      body{margin:12px}
      .grid2,.grid3{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div>
      <h2>Онлайн-склад</h2>
      <div id="metaLine" class="meta">Загружаю…</div>
    </div>
    <div id="modeChip" class="chip">Показать всё</div>
  </div>

  <div class="card">
    <div class="meta" style="margin-bottom:6px;">Добавить продукт</div>

    <input id="name" placeholder="Название (например: молоко)" />

    <div class="grid2">
      <input id="qty" placeholder="Количество" inputmode="decimal" />
      <input id="unit" placeholder="Ед. (л / шт / г)" />
    </div>

    <div class="grid2">
      <div>
        <div class="meta">Срок годности (с упаковки)</div>
        <input id="expiry_date" type="date" />
      </div>
      <div>
        <div class="meta">Дата вскрытия</div>
        <input id="opened_date" type="date" />
      </div>
    </div>

    <div class="grid2">
      <input id="opened_days" placeholder="Годен после вскрытия (дней)" inputmode="numeric" />
      <input id="kcal" placeholder="ккал / 100г (опц.)" inputmode="decimal" />
    </div>

    <input id="notes" placeholder="Заметка (опционально)" />

    <button id="addBtn" class="primary">Добавить</button>

    <div class="meta" style="margin-top:8px;">
      Если указал <b>дату вскрытия</b> + <b>дни</b> — “Использовать до” считается от вскрытия.
    </div>
  </div>

  <div class="actionsRow">
    <button id="reloadBtn">Обновить</button>
    <button id="soonBtn">Скоро/Просрочено</button>
  </div>

  <div id="list"></div>

<script>
  const tg = window.Telegram?.WebApp;
  try { tg?.ready(); tg?.expand(); } catch(e){}

  // === ТВОЙ Apps Script WebApp URL (exec) ===
  const API_URL = "https://script.google.com/macros/s/AKfycbwk0uyNVcv8Hx7dtP3B7CgDx2Aa5ixagj56FyfAwSWxM0ZUbY5bZoQK_2RDCdHoW5UO/exec";

  let filterSoon = false;

  // user_id для авторизации
  function getUserId(){
    const tgId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "";
    // если открыли вне телеги — попросим один раз
    if (tgId) return tgId;

    const saved = localStorage.getItem("edahuyna_uid") || "";
    if (saved) return saved;

    const manual = prompt("Введите ваш Telegram user_id (для доступа):", "");
    if (manual && String(manual).trim()) {
      localStorage.setItem("edahuyna_uid", String(manual).trim());
      return String(manual).trim();
    }
    return "";
  }

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function isoToRuDate(iso){
    if (!iso) return "—";
    const d = new Date(String(iso));
    if (isNaN(d.getTime())) return esc(iso);
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yy = d.getFullYear();
    return `${dd}.${mm}.${yy}`;
  }

  function statusRu(status){
    if (status === "ok") return "Ок";
    if (status === "soon") return "Скоро";
    if (status === "expired") return "Просрочено";
    return "";
  }

  function statusPill(status){
    const t = statusRu(status);
    if (!t) return "";
    return `<span class="pill ${esc(status)}">${esc(t)}</span>`;
  }

  const CAT = {
    ready:{label:"Готовое", icon:"🍱"},
    veggies:{label:"Овощи/фрукты", icon:"🥬"},
    dairy:{label:"Молочка", icon:"🥛"},
    bakery:{label:"Хлеб", icon:"🍞"},
    sweet:{label:"Сладкое/снэки", icon:"🍫"},
    meat:{label:"Мясо/птица", icon:"🥩"},
    eggs:{label:"Яйца", icon:"🥚"},
    frozen:{label:"Заморозка", icon:"🧊"},
    canned:{label:"Консервы", icon:"🥫"},
    grocery:{label:"Бакалея", icon:"🍚"},
    other:{label:"Другое", icon:"🧺"},
  };

  function catIcon(key){ return (CAT[key]?.icon) || "🧺"; }
  function catLabel(key){ return (CAT[key]?.label) || "Другое"; }

  async function apiGet(params){
    const url = new URL(API_URL);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
    const res = await fetch(url.toString());
    return await res.json();
  }

  async function apiPost(payload){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // важно для GAS
      body: JSON.stringify(payload),
    });
    return await res.json();
  }

  function itemHtml(i){
    const title = `${catIcon(i.category)} ${esc(i.name || "")}`;
    const qtyLine = `Кол-во: <b>${esc(i.qty || "—")} ${esc(i.unit || "")}</b>`;
    const useBy = isoToRuDate(i.use_by_date);
    const exp = i.expiry_date ? isoToRuDate(i.expiry_date) : "—";
    const opened = i.opened_date ? isoToRuDate(i.opened_date) : "";
    const openedDays = i.opened_days ? `${esc(i.opened_days)} дн.` : "";
    const storage = i.storage ? esc(i.storage) : "";

    const extra = [];
    if (opened) extra.push(`Вскрыто: <b>${opened}</b>`);
    if (openedDays) extra.push(`После вскрытия: <b>${openedDays}</b>`);
    if (storage) extra.push(`Хранение: <b>${storage}</b>`);
    if (i.kcal_per_100) extra.push(`ккал/100: <b>${esc(i.kcal_per_100)}</b>`);
    if (i.notes) extra.push(`Заметка: <b>${esc(i.notes)}</b>`);

    return `
      <div class="card">
        <div class="rowTitle">
          <div class="name">${title}</div>
          ${statusPill(i.status)}
        </div>

        <div class="subline">${qtyLine}</div>
        <div class="subline">Категория: <b>${esc(catLabel(i.category))}</b></div>
        <div class="subline">Использовать до: <b>${useBy}</b> <span class="meta">(с упаковки: ${exp})</span></div>

        ${extra.length ? `<div class="sep"></div><div class="subline">${extra.join(" • ")}</div>` : ``}

        <div class="actionsRow" style="margin-top:12px;">
          <button class="danger" onclick="eatItem('${esc(i.id)}')">Съели</button>
        </div>
      </div>
    `;
  }

  async function load(){
    const uid = getUserId();
    if (!uid) {
      document.getElementById("metaLine").textContent = "Нет user_id — доступ не проверить.";
      document.getElementById("list").innerHTML = `<div class="empty">Открой через Telegram или введи user_id.</div>`;
      return;
    }

    const data = await apiGet({ action: "list", user_id: uid });

    if (!data || !data.ok){
      const err = data?.error ? String(data.error) : "Ошибка API";
      document.getElementById("metaLine").textContent = err;
      document.getElementById("list").innerHTML = `<div class="empty">${esc(err)}</div>`;
      return;
    }

    const items = Array.isArray(data.items) ? data.items : [];
    const meta = data.meta || {};
    document.getElementById("metaLine").textContent =
      `${meta.app_name || "едахуйня"} • TZ: ${meta.tz || "—"} • “Скоро” ≤ ${meta.notify_soon_day ?? "—"} дн.`;

    const view = filterSoon
      ? items.filter(i => i.status === "soon" || i.status === "expired")
      : items;

    document.getElementById("modeChip").textContent = filterSoon ? "Только срочное" : "Показать всё";
    document.getElementById("list").innerHTML =
      view.length ? view.map(itemHtml).join("") : `<div class="empty">Пока пусто.</div>`;
  }

  async function add(){
    const uid = getUserId();
    if (!uid) return alert("Нет user_id");

    const name = document.getElementById("name").value.trim();
    const qty = document.getElementById("qty").value.trim();
    const unit = document.getElementById("unit").value.trim();
    const expiry_date = document.getElementById("expiry_date").value; // YYYY-MM-DD
    const opened_date = document.getElementById("opened_date").value; // YYYY-MM-DD
    const opened_days = document.getElementById("opened_days").value.trim();
    const kcal_per_100 = document.getElementById("kcal").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!name) return (tg?.showAlert ? tg.showAlert("Введите название") : alert("Введите название"));
    if (!expiry_date && !opened_date) return (tg?.showAlert ? tg.showAlert("Укажите срок годности или дату вскрытия") : alert("Укажите срок годности или дату вскрытия"));

    const res = await apiPost({
      user_id: uid,
      action: "add",
      item: { name, qty, unit, expiry_date, opened_date, opened_days, kcal_per_100, notes }
    });

    if (!res || !res.ok){
      const err = res?.error ? String(res.error) : "Ошибка добавления";
      return (tg?.showAlert ? tg.showAlert(err) : alert(err));
    }

    // reset
    document.getElementById("name").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("unit").value = "";
    document.getElementById("expiry_date").value = "";
    document.getElementById("opened_date").value = "";
    document.getElementById("opened_days").value = "";
    document.getElementById("kcal").value = "";
    document.getElementById("notes").value = "";

    await load();
  }

  window.eatItem = async function(id){
    const uid = getUserId();
    if (!uid) return;

    const res = await apiPost({ user_id: uid, action: "eat", id });
    if (!res || !res.ok){
      const err = res?.error ? String(res.error) : "Ошибка";
      return (tg?.showAlert ? tg.showAlert(err) : alert(err));
    }
    await load();
  }

  document.getElementById("addBtn").onclick = add;
  document.getElementById("reloadBtn").onclick = load;
  document.getElementById("soonBtn").onclick = () => { filterSoon = !filterSoon; load(); };

  load();
</script>
</body>
</html>
